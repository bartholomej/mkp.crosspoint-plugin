name: 🚀 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: 🚀 Release

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: 🔎 Check the payload
        run: node scripts/check-release.ts "$GITHUB_REF_NAME"

      - name: 🚀 Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Czech E-books (MKP) ${GITHUB_REF_NAME#v}"
